[project]
name = "recipe-qa-svc"
version = "0.1.0"
description = "Recipe Q&A service grounded in a Wikibooks Cookbook corpus"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0,<0.140",
    "uvicorn[standard]>=0.51.0,<0.52",
    "pydantic>=2.13.4,<3",
    "pydantic-settings>=2.14.2,<3",
    "openai>=2.45.0,<3",
    "sentence-transformers>=5.6.0,<6",
    "tenacity>=9.1.4,<10",
    "rank-bm25>=0.2.2,<0.3",
    "numpy>=2,<3",
    "httpx>=0.28.1,<0.29",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.0,<2",
    "ruff>=0.15.21,<0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_qa"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
