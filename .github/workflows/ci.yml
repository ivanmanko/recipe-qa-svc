name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  # Deployment itself is git-driven: Northflank builds and deploys every push
  # to main (see northflank-template.json). This job verifies the deployment:
  # wait until /health responds, then run the full eval harness against prod.
  # Skipped while the service is intentionally scaled to zero between review
  # sessions (repository variable PROD_PAUSED=true) — otherwise every commit
  # would spend 20 minutes waiting for a service nobody is paying to run.
  # Set PROD_PAUSED=false when the deployment is up and this gate applies again.
  verify-deploy:
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && vars.PROD_PAUSED != 'true'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      # Waits for THIS commit to be serving, not merely for a healthy
      # response: Northflank rolls the new container in while the old one is
      # still answering, and evals run against the outgoing container would
      # fail halfway through the rollout (observed).
      - name: Wait for this revision to be live
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::warning::PROD_URL secret not set — deploy verification skipped"
            exit 0
          fi
          for i in $(seq 1 120); do
            LIVE=$(curl -fsS --max-time 10 "$PROD_URL/health" 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin).get('git_sha',''))" 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ]; then
              echo "revision $GITHUB_SHA is live"
              exit 0
            fi
            echo "waiting for $GITHUB_SHA (serving: ${LIVE:-none}) [$i/120]"
            sleep 10
          done
          echo "revision $GITHUB_SHA did not go live within 20 minutes" >&2
          exit 1
      - name: Run eval harness against production
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::warning::PROD_URL secret not set — prod evals skipped"
            exit 0
          fi
          uv run python evals/run_evals.py --target "$PROD_URL"
